# Benchmark matrix: 3 frameworks x (JVM, GraalVM native) + Unikraft Unikernel = 7 apps
#
#                  | JVM (Temurin 21 JRE)  | GraalVM native (musl binary) | Unikraft Unikernel
#   Spring Boot    | bench-spring          | bench-spring-native          | bench-spring-unikraft
#   Plain Java     | bench-plain           | bench-plain-native           | -
#   Quarkus        | bench-quarkus         | bench-quarkus-native         | -
#
# Builder runtimes:  java-maven-latest (JVM jars)   graal-native-latest (native binaries)   unikraft-builder-latest (unikraft unikernel)
# Runner runtimes:   java-jre-latest   (JVM apps)   naked-latest        (native apps)       direct unikernel boot (unikraft)

apps:
  # ==========================================================================
  # JVM MODE
  # ==========================================================================

  # ---------- Spring Boot (JVM) ----------
  bench-spring:
    ci:
      jobs:
        - name: build-spring
          runtime: java-maven-latest
          tshirt: standard
          commands:
            # 1. Build executable fat jar (deps cached in /root/.m2)
            - cd spring-app && mvn -B -q -DskipTests package
            # 2. Copy jar to persistent /app drive
            - mkdir -p /app/spring
            - cp spring-app/target/bench-spring.jar /app/spring/app.jar

    cd:
      runtime: java-jre-latest
      tshirt: standard
      type: warm
      start_commands:
        - sysctl -w net.ipv4.ip_local_port_range="1024 65535" || true
        - sysctl -w net.ipv4.tcp_tw_reuse=1 || true
        - sysctl -w net.core.somaxconn=65535 || true
        - sysctl -w net.ipv4.tcp_max_syn_backlog=65535 || true
        - sh -c 'ulimit -n 65535 && exec java -XX:+UseSerialGC -XX:MaxRAMPercentage=75 -XX:-UsePerfData -Djava.security.egd=file:/dev/./urandom -jar /app/spring/app.jar --server.address=0.0.0.0 --server.port=8080'
      port: 8080
      connection_limit: 500

  # ---------- Plain Java (JVM) ----------
  bench-plain:
    ci:
      jobs:
        - name: build-plain
          runtime: java-maven-latest
          tshirt: standard
          commands:
            # 1. Compile with javac (no Maven needed, no deps)
            - cd plain-app && rm -rf out && javac --release 21 -d out src/main/java/bench/plain/Main.java
            # 2. Package runnable jar straight onto persistent /app drive
            - mkdir -p /app/plain
            - jar --create --file /app/plain/app.jar --main-class bench.plain.Main -C plain-app/out .

    cd:
      runtime: java-jre-latest
      tshirt: standard
      type: warm
      start_commands:
        - sysctl -w net.ipv4.ip_local_port_range="1024 65535" || true
        - sysctl -w net.ipv4.tcp_tw_reuse=1 || true
        - sysctl -w net.core.somaxconn=65535 || true
        - sysctl -w net.ipv4.tcp_max_syn_backlog=65535 || true
        - sh -c 'ulimit -n 65535 && exec java -XX:+UseSerialGC -XX:MaxRAMPercentage=75 -XX:-UsePerfData -Djava.security.egd=file:/dev/./urandom -jar /app/plain/app.jar --host 0.0.0.0 --port 8080'
      port: 8080
      connection_limit: 500

  # ---------- Quarkus (JVM) ----------
  bench-quarkus:
    ci:
      jobs:
        - name: build-quarkus
          runtime: java-maven-latest
          tshirt: standard
          commands:
            # 1. Build Quarkus fast-jar (target/quarkus-app/ directory)
            - cd quarkus-app && mvn -B -q -DskipTests package
            # 2. Copy the whole quarkus-app dir (quarkus-run.jar needs its lib/ app/ quarkus/ siblings)
            - rm -rf /app/quarkus && mkdir -p /app/quarkus
            - cp -r quarkus-app/target/quarkus-app /app/quarkus/

    cd:
      runtime: java-jre-latest
      tshirt: standard
      type: warm
      start_commands:
        - sysctl -w net.ipv4.ip_local_port_range="1024 65535" || true
        - sysctl -w net.ipv4.tcp_tw_reuse=1 || true
        - sysctl -w net.core.somaxconn=65535 || true
        - sysctl -w net.ipv4.tcp_max_syn_backlog=65535 || true
        - sh -c 'ulimit -n 65535 && exec java -XX:+UseSerialGC -XX:MaxRAMPercentage=75 -XX:-UsePerfData -Djava.security.egd=file:/dev/./urandom -Dquarkus.http.host=0.0.0.0 -Dquarkus.http.port=8080 -jar /app/quarkus/quarkus-app/quarkus-run.jar'
      port: 8080
      connection_limit: 500

  # ==========================================================================
  # GRAALVM NATIVE MODE  (musl binaries -> run on plain alpine)
  # ==========================================================================

  # ---------- Spring Boot (native) ----------
  bench-spring-native:
    ci:
      jobs:
        - name: build-spring-native
          runtime: graal-native-latest
          tshirt: ci-heavy
          commands:
            # 1. Spring AOT + native-image (Liberica NIK musl, Maven on PATH)
            - mvn -B -e -f spring-app/pom.xml -Pnative -DskipTests native:compile
            # 2. Copy binary to persistent /app drive
            - mkdir -p /app/spring-native
            - cp spring-app/target/bench-spring /app/spring-native/bench-spring
            - chmod +x /app/spring-native/bench-spring

    cd:
      runtime: naked-latest
      tshirt: standard
      type: warm
      start_commands:
        - sysctl -w net.ipv4.ip_local_port_range="1024 65535" || true
        - sysctl -w net.ipv4.tcp_tw_reuse=1 || true
        - sysctl -w net.core.somaxconn=65535 || true
        - sysctl -w net.ipv4.tcp_max_syn_backlog=65535 || true
        - sh -c 'ulimit -n 65535 && exec /app/spring-native/bench-spring --server.address=0.0.0.0 --server.port=8080'
      port: 8080
      connection_limit: 500

  # ---------- Plain Java (native) ----------
  bench-plain-native:
    ci:
      jobs:
        - name: build-plain-native
          runtime: graal-native-latest
          tshirt: ci-heavy
          commands:
            # 1. Compile classes
            - cd plain-app && rm -rf out && javac --release 21 -d out src/main/java/bench/plain/Main.java
            # 2. native-image (no-fallback, no Maven needed)
            - cd plain-app && native-image --no-fallback -cp out bench.plain.Main -o bench-plain
            # 3. Copy binary to persistent /app drive
            - mkdir -p /app/plain-native
            - cp plain-app/bench-plain /app/plain-native/bench-plain
            - chmod +x /app/plain-native/bench-plain

    cd:
      runtime: naked-latest
      tshirt: standard
      type: warm
      start_commands:
        - sysctl -w net.ipv4.ip_local_port_range="1024 65535" || true
        - sysctl -w net.ipv4.tcp_tw_reuse=1 || true
        - sysctl -w net.core.somaxconn=65535 || true
        - sysctl -w net.ipv4.tcp_max_syn_backlog=65535 || true
        - sh -c 'ulimit -n 65535 && exec /app/plain-native/bench-plain --host 0.0.0.0 --port 8080'
      port: 8080
      connection_limit: 500

  # ---------- Quarkus (native) ----------
  bench-quarkus-native:
    ci:
      jobs:
        - name: build-quarkus-native
          runtime: graal-native-latest
          tshirt: ci-heavy
          commands:
            # 1. Quarkus native build; "-Dnative" activates the pom profile
            - mvn -B -e -f quarkus-app/pom.xml -Dnative -DskipTests package
            # 2. Copy binary to persistent /app drive
            - mkdir -p /app/quarkus-native
            - cp quarkus-app/target/*runner /app/quarkus-native/bench-quarkus
            - chmod +x /app/quarkus-native/bench-quarkus

    cd:
      runtime: naked-latest
      tshirt: standard
      type: warm
      start_commands:
        - sysctl -w net.ipv4.ip_local_port_range="1024 65535" || true
        - sysctl -w net.ipv4.tcp_tw_reuse=1 || true
        - sysctl -w net.core.somaxconn=65535 || true
        - sysctl -w net.ipv4.tcp_max_syn_backlog=65535 || true
        - sh -c 'ulimit -n 65535 && exec /app/quarkus-native/bench-quarkus -Dquarkus.http.host=0.0.0.0 -Dquarkus.http.port=8080'
      port: 8080
      connection_limit: 500

  # ==========================================================================
  # UNIKRAFT UNIKERNEL MODE
  # ==========================================================================

  # ---------- Spring Boot (Unikraft Unikernel) ----------
  bench-spring-unikraft:
    ci:
      jobs:
        - name: build-spring-unikraft
          type: unikernel
          runtime: docker-tools
          tshirt: large
          artifacts:
            unikernel: "unikernel"
            cpio: "initramfs-x86_64.cpio"
          commands:
            - echo "🐳 Verifying / Starting Docker daemon..."
            - sh -c 'if ! docker info >/dev/null 2>&1; then mkdir -p /sys/fs/cgroup && mount -t tmpfs -o uid=0,gid=0,mode=0755 cgroup /sys/fs/cgroup && for s in $(awk "!/^#/ { if (\$4 == 1) print \$1 }" /proc/cgroups); do mkdir -p /sys/fs/cgroup/$s && mount -t cgroup -o $s cgroup /sys/fs/cgroup/$s || true; done && mkdir -p /sys/fs/cgroup/unified && mount -t cgroup2 none /sys/fs/cgroup/unified 2>/dev/null || true; mkdir -p /cache/docker && dockerd --data-root=/cache/docker --host=unix:///var/run/docker.sock --iptables=false --storage-driver=overlay2 > /var/log/dockerd.log 2>&1 & i=0; while ! docker info >/dev/null 2>&1; do sleep 0.2; i=$((i+1)); if [ $i -ge 50 ]; then echo "DOCKERD FAILED TO START:"; cat /var/log/dockerd.log; exit 1; fi; done; fi'
            - echo "🔨 Building Spring Boot Unikernel artifacts inside Docker..."
            - cd spring-unikraft && docker build -t spring-unikraft-artifacts -f Dockerfile.build .
            - echo "📦 Extracting artifacts from Docker container..."
            - mkdir -p /workspace
            - sh -c 'CID=$(docker create spring-unikraft-artifacts) && docker cp $CID:/unikernel /workspace/unikernel && docker cp $CID:/initramfs-x86_64.cpio /workspace/initramfs-x86_64.cpio && docker rm $CID'
            - ls -lh /workspace/unikernel /workspace/initramfs-x86_64.cpio
            - echo "✅ Success! Unikernel and CPIO ready in /workspace."

    cd:
      type: unikernel
      tshirt: standard
      port: 8080
      boot_args: 'vfs.fstab=["initrd0:/:extract:::"] -- /usr/bin/java -XX:+UseSerialGC -XX:MaxRAMPercentage=75 -jar /app.jar --server.address=0.0.0.0 --server.port=8080'
