# Benchmark matrix: {spring, plain, quarkus} x {JVM, GraalVM native} + Unikraft = 7 apps
forge: []

app:
  # ==========================================
  # APP 7: BENCH SPRING UNIKRAFT (Unikraft Unikernel)
  # ==========================================
  - name: "Engine: Prepare Environment (Bench Spring Unikraft)"
    action: "prepare_env"
    subject: "anzar.cmd.{cluster}.{host}.engine.env.prepare"
    payload:
      context_id: "e2e-job-app-bench-spring-unikraft-001"
      env_id: "env-app-bench-spring-unikraft"
      runtime: "docker-tools"
      tshirt: "large"

  - name: "Shiroe: Orchestrate Pipeline Saga (Bench Spring Unikraft)"
    action: "run_pipeline"
    subject: "anzar.cmd.{cluster}.{host}.workflow.run_pipeline"
    payload:
      context_id: "e2e-job-app-bench-spring-unikraft-002"
      env_id: "env-app-bench-spring-unikraft"
      git_config:
        repo_url: "https://github.com/rsanzar/java.git" # <-- your repo
        branch: "main"
        commit_hash: "FETCH_HEAD"
        app_name: "bench-spring-unikraft"

  - name: "Shiroe: Stage CD Deployment (Bench Spring Unikraft)"
    action: "stage_deployment"
    subject: "anzar.cmd.{cluster}.{host}.workflow.stage_deployment"
    payload:
      context_id: "e2e-cd-stage-bench-spring-unikraft-001"
      parent_env_id: "env-app-bench-spring-unikraft"
      cd_env_id: "cd-env-prod-bench-spring-unikraft"
      app_domain: "bench-spring-unikraft.sadala.anzar.cloud"
      compute:
        type: "serverless"
  #        scaling:
  #          policy: "fixed"
  #          instances: 1
  #        load_balancer: "round_robin"

  - name: "Bifrost & Shiroe: Traffic Verification (Bench Spring Unikraft)"
    action: "simulate_traffic"
    subject: "none"
    payload:
      app_domain: "bench-spring-unikraft.sadala.anzar.cloud"
      target: "127.0.0.1"
      requests: 0
