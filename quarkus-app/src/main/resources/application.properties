quarkus.application.name=bench-quarkus
quarkus.http.host=${HOST:0.0.0.0}
quarkus.http.port=${PORT:8080}

quarkus.banner.enabled=false
quarkus.log.level=WARN
# keeps the "bench-quarkus 1.0.0 ... started in X s" line
quarkus.log.category."io.quarkus".level=INFO

# Fix musl 1.2.4+ missing fstat64/stat64 symbols during native link step
quarkus.native.additional-build-args=-H:NativeLinkerOption=-Wl\\,--defsym=fstat64=fstat\\,--defsym=stat64=stat\\,--defsym=lstat64=lstat
