spring.application.name=bench-spring
server.address=${HOST:0.0.0.0}
server.port=${PORT:8080}

# Virtual threads for request handling (Java 21) - same model as the plain server
spring.threads.virtual.enabled=true

# Keep startup lean
spring.main.banner-mode=off
spring.jmx.enabled=false
logging.level.root=WARN
# keeps the "Started BenchSpringApplication in X seconds" line
logging.level.bench.spring=INFO
